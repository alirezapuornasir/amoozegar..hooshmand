name: Extract AmooZegar Project

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Extract ZIP
        run: |
          set -eux

          ZIP_FILE="amoozegar-hooshmand-GitHub.zip"

          echo "Checking ZIP file..."
          ls -lah

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p /tmp/amoozegar-project

          unzip -o "$ZIP_FILE" -d /tmp/amoozegar-project

          SOURCE="/tmp/amoozegar-project"

          if [ -d "$SOURCE/amoozegar-hooshmand" ]; then
            SOURCE="$SOURCE/amoozegar-hooshmand"
          fi

          echo "Copying project files..."

          rsync -av \
            --exclude='.git' \
            "$SOURCE/" ./

          echo "Extraction completed."

      - name: Validate project
        run: |
          set -eux

          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -d assets
          test -d data

          echo "Project validation successful."

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install complete AmooZegar project"

          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Finish
        if: success()
        run: |
          echo "AmooZegar project installed successfully!"
