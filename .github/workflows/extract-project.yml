name: Extract AmooZegar Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract ZIP
        run: |
          set -eux

          ZIP_FILE="amoozegar-hooshmand-GitHub.zip"

          ls -lah

          test -f "$ZIP_FILE"

          mkdir -p /tmp/project

          unzip -o "$ZIP_FILE" -d /tmp/project

          SOURCE="/tmp/project"

          if [ -d "$SOURCE/amoozegar-hooshmand" ]; then
            SOURCE="$SOURCE/amoozegar-hooshmand"
          fi

          rsync -av "$SOURCE/" ./

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git status

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Build AmooZegar project"

          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report result
        if: always()
        run: echo "Workflow finished with status ${{ job.status }}"
