name: Extract AmooZegar Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE="amoozegar-hooshmand-GitHub.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          mkdir -p /tmp/amoozegar-extract

          unzip -q "$ZIP_FILE" -d /tmp/amoozegar-extract

          if [ -d "/tmp/amoozegar-extract/amoozegar-hooshmand" ]; then
            SOURCE="/tmp/amoozegar-extract/amoozegar-hooshmand"
          else
            SOURCE="/tmp/amoozegar-extract"
          fi

          rsync -av "$SOURCE/" ./

          echo "Project extracted successfully!"

      - name: Remove ZIP archive
        run: |
          rm -f amoozegar-hooshmand-GitHub.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract complete AmooZegar project"
            git push
          fi
